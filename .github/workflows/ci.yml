name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.7"
  JAVA_VERSION: "21"

jobs:
  analyze:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runs before analyze: formatting failures are cheap to surface first.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `gradlew` and `gradle-wrapper.jar` are not tracked (Flutter's default
      # ignore rules), so the wrapper must be regenerated before Gradle runs.
      # Building through `flutter build` handles that; never call ./gradlew here.
      # A flavor and target are mandatory now that productFlavors are declared:
      # a bare `flutter build apk` fails once flavorDimensions exist.
      - name: Build debug APK (dev flavor)
        run: flutter build apk --debug --flavor dev --target lib/main_dev.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nakshatra-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
