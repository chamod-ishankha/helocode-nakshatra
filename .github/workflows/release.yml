name: Release

# Deliberately NOT triggered by pull_request. This repository is public, and a
# workflow that both checks out untrusted code and holds signing secrets is how
# upload keys leak. GitHub already withholds secrets from fork PRs, but scoping
# the trigger means the question never arises.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "What this build is for (label only, nothing is uploaded)"
        required: false
        default: "internal"

env:
  FLUTTER_VERSION: "3.41.7"
  JAVA_VERSION: "21"

jobs:
  bundle:
    name: Signed app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build-time config. These values are not secret — they ship inside the
      # APK — but they are kept in secrets so dev and prod can differ and so
      # they can be rotated without a commit.
      - name: Write env/prod.json
        run: |
          mkdir -p env
          cat > env/prod.json <<'JSON'
          {
            "ADMOB_APP_ID": "${{ vars.ADMOB_APP_ID }}",
            "ADMOB_BANNER_UNIT_ID": "${{ vars.ADMOB_BANNER_UNIT_ID }}",
            "ADMOB_INTERSTITIAL_UNIT_ID": "${{ vars.ADMOB_INTERSTITIAL_UNIT_ID }}",
            "ADMOB_REWARDED_UNIT_ID": "${{ vars.ADMOB_REWARDED_UNIT_ID }}",
            "REVENUECAT_PUBLIC_SDK_KEY": "${{ vars.REVENUECAT_PUBLIC_SDK_KEY }}"
          }
          JSON

      # The upload keystore IS secret. Losing it is unrecoverable and leaking it
      # lets someone sign builds as us, so it is stored base64-encoded and the
      # decoded file never leaves the runner.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See README > Release signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define-from-file=env/prod.json

      - name: Verify it is signed with the upload key, not debug keys
        run: |
          AAB=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          OWNER=$(keytool -printcert -jarfile "$AAB" | grep -m1 "Owner:")
          echo "$OWNER"
          if echo "$OWNER" | grep -q "Android Debug"; then
            echo "::error::Bundle was signed with DEBUG keys. Play will reject it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nakshatra-prod-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30

      # Secrets are scrubbed even if an earlier step fails.
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
