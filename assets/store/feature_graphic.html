<!doctype html>
<meta charset="utf-8">
<title>Nakshatra — Play feature graphic</title>
<!--
  The Play Store feature graphic, as markup (KAN-39).

  Built this way because image generators cannot render Sinhala or Tamil.
  Two attempts produced a misspelt app name (நகஷ்திரார் rather than
  நட்சத்திரா), a long-i in සිංහල, and on the second pass a page of invented
  English and a Ganesha icon. A browser shapes Indic text correctly every
  time, and the strings below are the same ones the app ships.

  The fonts are the app's own bundled Noto faces, so the wordmark renders
  exactly as the app does on a device.

  Export:  python tool/build_feature_graphic.py
  Output:  assets/store/feature_graphic_1024x500.png  (Play's exact size)

  Keep the canvas at 1024x500. Play crops the edges on some surfaces, so
  nothing that matters sits within 32px of a border.
-->
<style>
  @font-face {
    font-family: 'NotoSansSinhala';
    src: url('../fonts/NotoSansSinhala.ttf') format('truetype');
  }
  @font-face {
    font-family: 'NotoSansTamil';
    src: url('../fonts/NotoSansTamil.ttf') format('truetype');
  }

  :root {
    /* Straight from the app: AppTheme.primary and SemanticColors.accent
       (dark), so the banner and the first screen agree. */
    --gold: #E0B450;
    --gold-dim: #C9973C;
    --ink: #FFFFFF;
    --muted: #B6A9D8;
  }

  html, body { margin: 0; padding: 0; }

  .canvas {
    width: 1024px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(900px 500px at 78% 18%, #3A2566 0%, transparent 62%),
      linear-gradient(150deg, #171238 0%, #241a4a 48%, #15102F 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    box-sizing: border-box;
    padding: 0 52px;
  }

  /* A faint starfield. Deliberately sparse — at 1024x500 anything busier
     reads as noise once Play shrinks it. */
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
  }

  .left { width: 512px; flex: none; }

  .lockup { display: flex; align-items: center; gap: 22px; }

  .mark {
    width: 112px; height: 112px; flex: none;
    border-radius: 26px;
    /* The icon's own background is the same navy as this banner, so without
       a ring and a lift the star floats in nothing. */
    box-shadow: 0 0 0 2px rgba(224,180,80,.45), 0 12px 34px rgba(0,0,0,.55);
    filter: saturate(1.08) brightness(1.06);
  }

  .wordmark {
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -1.2px;
    line-height: 1.02;
  }

  /* All three names, or none. Tamil alone was the odd thing about the
     generated version — Sinhala is the larger audience here. */
  .names {
    margin-top: 6px;
    font-size: 25px;
    color: var(--gold);
    line-height: 1.35;
  }
  .si { font-family: 'NotoSansSinhala', sans-serif; }
  .ta { font-family: 'NotoSansTamil', sans-serif; }
  .dot { color: var(--gold-dim); padding: 0 8px; }

  .tagline {
    margin-top: 20px;
    font-size: 24px;
    color: var(--muted);
    letter-spacing: .2px;
  }

  .sub {
    margin-top: 9px;
    font-size: 17px;
    color: rgba(182,169,216,.82);
    line-height: 1.4;
  }

  .badges { margin-top: 24px; display: flex; gap: 9px; }
  .badge {
    font-size: 15px;
    padding: 8px 15px;
    border-radius: 999px;
    color: #E8E1F6;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(224,180,80,.30);
    white-space: nowrap;
  }

  .right { flex: 1; padding-left: 38px; }

  .feature {
    display: flex;
    align-items: center;
    gap: 17px;
    margin-bottom: 26px;
  }
  .feature:last-child { margin-bottom: 0; }

  .glyph {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(224,180,80,.13);
    border: 1px solid rgba(224,180,80,.34);
  }
  .glyph svg { width: 22px; height: 22px; stroke: var(--gold); fill: none;
               stroke-width: 1.9; stroke-linecap: round;
               stroke-linejoin: round; }

  .label { font-size: 23px; line-height: 1.25; font-weight: 600;
           white-space: nowrap; }

  .footer {
    position: absolute;
    right: 52px; bottom: 26px;
    font-size: 13px;
    letter-spacing: .4px;
    color: rgba(182,169,216,.75);
  }
</style>

<div class="canvas">
  <!-- Starfield -->
  <div class="star" style="left:120px;top:44px;width:3px;height:3px;opacity:.75"></div>
  <div class="star" style="left:300px;top:92px;width:2px;height:2px;opacity:.5"></div>
  <div class="star" style="left:470px;top:38px;width:2px;height:2px;opacity:.6"></div>
  <div class="star" style="left:196px;top:430px;width:2px;height:2px;opacity:.45"></div>
  <div class="star" style="left:612px;top:120px;width:3px;height:3px;opacity:.55"></div>
  <div class="star" style="left:880px;top:60px;width:2px;height:2px;opacity:.5"></div>
  <div class="star" style="left:960px;top:250px;width:3px;height:3px;opacity:.45"></div>
  <div class="star" style="left:742px;top:452px;width:2px;height:2px;opacity:.4"></div>
  <div class="star" style="left:56px;top:250px;width:2px;height:2px;opacity:.4"></div>

  <div class="left">
    <div class="lockup">
      <img class="mark" src="play_icon_512.png" alt="">
      <div>
        <div class="wordmark">Nakshatra</div>
        <div class="names">
          <span class="si">නක්ෂත්‍ර</span><span class="dot">·</span><span class="ta">நட்சத்திரா</span>
        </div>
      </div>
    </div>

    <div class="tagline">Nekath · Litha · Horoscope</div>
    <div class="sub">Computed on your phone, offline, in your language.</div>

    <div class="badges">
      <span class="badge">Works offline</span>
      <span class="badge">No account</span>
      <span class="badge">සිංහල · தமிழ் · English</span>
    </div>
  </div>

  <div class="right">
    <div class="feature">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4"/>
          <path d="M12 2.3v2.6M12 19.1v2.6M2.3 12h2.6M19.1 12h2.6
                   M5.1 5.1l1.9 1.9M17 17l1.9 1.9M18.9 5.1L17 7M7 17l-1.9 1.9"/></svg>
      </div>
      <div class="label">Today's nekath</div>
    </div>

    <div class="feature">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5
                   a6.7 6.7 0 0 0 11.1 11.1Z"/></svg>
      </div>
      <div class="label">Poya days and the litha</div>
    </div>

    <div class="feature">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="2"/>
          <path d="M3.2 9.1h17.6M3.2 14.9h17.6M9.1 3.2v17.6M14.9 3.2v17.6"/></svg>
      </div>
      <div class="label">Birth chart and daśā</div>
    </div>

    <div class="feature">
      <div class="glyph">
        <svg viewBox="0 0 24 24"><path d="M12 20.4S3.6 15.2 3.6 9.4A4.6 4.6 0 0 1 12 6.8
                   a4.6 4.6 0 0 1 8.4 2.6c0 5.8-8.4 11-8.4 11Z"/></svg>
      </div>
      <div class="label">Marriage porondam</div>
    </div>
  </div>

  <div class="footer">FOR ENTERTAINMENT PURPOSES ONLY</div>
</div>
