# Dev flavor icon: teal, so it is unmistakable next to prod on the home screen.
# Output lands in android/app/src/dev/res and Gradle merges it over main/.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon_dev.png"

  android: "ic_launcher"
  adaptive_icon_background: "assets/icon/icon_background_dev.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

  # iOS flavor icons need matching Xcode build configurations, which do not
  # exist yet. Prod supplies the iOS icon from the pubspec config.
  ios: false
