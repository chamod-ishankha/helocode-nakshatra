name: Release

# Deliberately NOT triggered by pull_request. This repository is public, and a
# workflow that both checks out untrusted code and holds signing secrets is how
# upload keys leak. GitHub already withholds secrets from fork PRs, but scoping
# the trigger means the question never arises.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      dry_run:
        description: "Build and sign only — do not upload to Play"
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.41.7"
  JAVA_VERSION: "21"

  # versionCode is derived from pubspec, not from the clock. The release
  # scripts advance the version and this reads whatever they wrote, so a
  # bundle built here and one built on a workstation carry the same number
  # for the same commit. The formula is repeated in both release scripts.

jobs:
  bundle:
    name: Signed app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build-time config. These values are not secret — they ship inside the
      # APK — but they are kept in secrets so dev and prod can differ and so
      # they can be rotated without a commit.
      - name: Write env/prod.json
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ vars.ADMOB_REWARDED_UNIT_ID }}
          ADMOB_TEST_DEVICE_IDS: ${{ vars.ADMOB_TEST_DEVICE_IDS }}
          REVENUECAT_PUBLIC_SDK_KEY: ${{ vars.REVENUECAT_PUBLIC_SDK_KEY }}
        run: |
          # An unset repository variable expands to an empty string, and empty
          # unit ids mean AdUnits.isConfigured is false - the app builds and
          # runs with ads silently switched off entirely. Defaulting to
          # Google's public test ids means an unconfigured release shows test
          # ads and earns nothing, which is visible, rather than showing
          # nothing at all, which looks like the integration is broken.
          : "${ADMOB_APP_ID:=ca-app-pub-3940256099942544~3347511713}"
          : "${ADMOB_BANNER_UNIT_ID:=ca-app-pub-3940256099942544/6300978111}"
          : "${ADMOB_INTERSTITIAL_UNIT_ID:=ca-app-pub-3940256099942544/1033173712}"
          : "${ADMOB_REWARDED_UNIT_ID:=ca-app-pub-3940256099942544/5224354917}"

          case "$ADMOB_APP_ID" in
            ca-app-pub-3940256099942544*)
              echo "::warning::Building with Google's TEST AdMob ids - this release will earn nothing. See KAN-56." ;;
          esac

          # Unquoted heredoc so the shell expands the defaults above. These
          # values are ad unit ids and a public SDK key - no quotes or
          # backslashes needing escapes.
          mkdir -p env
          cat > env/prod.json <<JSON
          {
            "ADMOB_APP_ID": "$ADMOB_APP_ID",
            "ADMOB_BANNER_UNIT_ID": "$ADMOB_BANNER_UNIT_ID",
            "ADMOB_INTERSTITIAL_UNIT_ID": "$ADMOB_INTERSTITIAL_UNIT_ID",
            "ADMOB_REWARDED_UNIT_ID": "$ADMOB_REWARDED_UNIT_ID",
            "ADMOB_TEST_DEVICE_IDS": "$ADMOB_TEST_DEVICE_IDS",
            "REVENUECAT_PUBLIC_SDK_KEY": "$REVENUECAT_PUBLIC_SDK_KEY"
          }
          JSON

      # Not tracked: it is gitignored so the public repo carries no Firebase
      # project config. The google-services Gradle plugin hard-fails without
      # it, which is what broke the first release run - "File
      # google-services.json is missing", exit 1, at the build step.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set. Produce it with: base64 -w0 android/app/google-services.json"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          # Fail loudly here rather than letting Gradle fail obscurely later.
          if ! grep -q '"project_id"' android/app/google-services.json; then
            echo "::error::Decoded google-services.json does not look right. Re-encode with: base64 -w0 android/app/google-services.json"
            exit 1
          fi

      # The upload keystore IS secret. Losing it is unrecoverable and leaking it
      # lets someone sign builds as us, so it is stored base64-encoded and the
      # decoded file never leaves the runner.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See README > Release signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Resolve version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | tr -d '[:space:]' | cut -d: -f2)
          case "$CURRENT" in
            *.*.*+*) ;;
            *) echo "::error::pubspec version '$CURRENT' is not major.minor.patch+build."; exit 1 ;;
          esac

          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          REST=${REST#*.}
          PATCH=${REST%%+*}
          BUILD=${REST#*+}

          NAME="$MAJOR.$MINOR.$PATCH"
          # Play refuses a versionCode it has already seen, and earlier
          # builds used clock-derived codes up to 1410854. This formula
          # clears those and rises with the version. Nothing is bumped
          # here: CI builds what the commit says, it does not choose the
          # next version.
          CODE=$(( MAJOR * 10000000 + MINOR * 100000 + PATCH * 1000 + BUILD ))
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"  >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($CODE)"

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --flavor prod \
            --target lib/main_prod.dart \
            --dart-define-from-file=env/prod.json \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Verify it is signed with the upload key, not debug keys
        run: |
          AAB=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          OWNER=$(keytool -printcert -jarfile "$AAB" | grep -m1 "Owner:")
          echo "$OWNER"
          if echo "$OWNER" | grep -q "Android Debug"; then
            echo "::error::Bundle was signed with DEBUG keys. Play will reject it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nakshatra-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30

      # Publishing to Play. Skipped automatically when the service account
      # secret is absent, so the workflow stays useful before it is configured
      # and for dry runs.
      - name: Check for Play credentials
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Play upload (no credentials, or dry run). The signed bundle is attached as an artifact."
          fi

      - name: Upload to Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.helocode.nakshatra
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ inputs.track || 'internal' }}
          # completed = live to that track's testers immediately. Internal
          # testing has no review queue, so this is the whole release.
          status: completed
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

      # Secrets are scrubbed even if an earlier step fails.
      - name: Remove signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties
          rm -f android/app/google-services.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### Nakshatra ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | ${{ steps.version.outputs.name }} |"
            echo "| versionCode | ${{ steps.version.outputs.code }} |"
            echo "| Track | ${{ inputs.track || 'internal' }} |"
            echo "| Uploaded to Play | ${{ steps.play.outputs.enabled == 'true' && 'yes' || 'no — artifact only' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
